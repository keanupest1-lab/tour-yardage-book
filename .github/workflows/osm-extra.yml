name: Extra map features
on:
  push:
    paths: ['courses/osm-extra-requests.txt', 'scripts/osm_extra.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: osm-extra
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy scipy pillow
      - name: Fetch
        env:
          PYTHONUNBUFFERED: '1'
        run: python3 scripts/osm_extra.py 2>&1 | tee courses/osm-extra-last-run.log
      - name: Save
        if: always()
        run: |
          git config --global user.name "course-bot"; git config --global user.email "course-bot@users.noreply.github.com"
          git add courses/osm-extra courses/osm-extra-last-run.log
          git diff --cached --quiet && exit 0
          git commit -m "Extra map features [skip ci]"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
