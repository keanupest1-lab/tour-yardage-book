name: Build ML dataset
on:
  push:
    paths: ['ml/regions.txt', 'ml/build_dataset.py', '.github/workflows/dataset.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ml-dataset
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pillow
      - name: Restore existing dataset (resume)
        run: |
          if git ls-remote --exit-code origin dataset >/dev/null 2>&1; then
            git fetch --depth 1 origin dataset
            git worktree add ds origin/dataset
            mkdir -p ml/data && cp -r ds/ml/data/. ml/data/ || true
          fi
      - name: Build
        continue-on-error: true
        timeout-minutes: 300
        env:
          MAX_CHIPS: '3000'
          PYTHONUNBUFFERED: '1'
        run: |
          mkdir -p ml/data
          python3 ml/build_dataset.py 2>&1 | tee ml/build.log
      - name: Publish to dataset branch
        if: always()
        run: |
          git config --global user.name "course-bot"
          git config --global user.email "course-bot@users.noreply.github.com"
          rm -rf /tmp/pub && mkdir -p /tmp/pub/ml && cp -r ml/data /tmp/pub/ml/ ; cp ml/build.log /tmp/pub/ml/ || echo "no log" > /tmp/pub/ml/build.log
          cd /tmp/pub && git init -q -b dataset && git add -A && git commit -q --allow-empty -m "Dataset $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" dataset
