name: Fetch courses
on:
  push:
    paths: ['courses/requests.txt', 'scripts/fetch-courses.mjs', '.github/workflows/fetch-courses.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fetch-courses
  cancel-in-progress: true
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure git
        run: |
          git config user.name "course-bot"
          git config user.email "course-bot@users.noreply.github.com"
      - name: Probe map servers
        run: |
          {
            echo "probe $(date -u +%FT%TZ)"
            for u in https://overpass-api.de/api/status https://overpass.private.coffee/api/status https://overpass.kumi.systems/api/status https://maps.mail.ru/osm/tools/overpass/api/status "https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q=Dainfern"; do
              echo "== $u"; curl -sS -m 30 -A "TourYardageBooks/0.3" -o /tmp/out -w "http %{http_code} in %{time_total}s\n" "$u" 2>&1; head -c 300 /tmp/out; echo
            done
          } > courses/_probe.log 2>&1 || true
          git add courses/_probe.log && git commit -qm "Map server probe [skip ci]" && git pull -q --rebase origin main && git push -q origin HEAD:main || true
      - run: node scripts/fetch-courses.mjs
