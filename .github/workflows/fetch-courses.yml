name: Fetch courses
on:
  push:
    paths: ['courses/requests.txt', 'scripts/fetch-courses.mjs']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fetch-courses
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-courses.mjs
      - name: Save results
        run: |
          git config user.name "course-bot"
          git config user.email "course-bot@users.noreply.github.com"
          git add courses
          git diff --cached --quiet && exit 0
          git commit -m "Course library update [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
