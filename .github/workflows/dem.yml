name: Elevation (Copernicus GLO-30)
on:
  push:
    paths: ['courses/dem-requests.txt', 'scripts/fetch_dem.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dem
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy rasterio
      - name: Fetch
        env:
          PYTHONUNBUFFERED: '1'
          AWS_NO_SIGN_REQUEST: 'YES'
          GDAL_DISABLE_READDIR_ON_OPEN: 'EMPTY_DIR'
        run: python3 scripts/fetch_dem.py 2>&1 | tee courses/dem-last-run.log
      - name: Save
        if: always()
        run: |
          git config --global user.name "course-bot"; git config --global user.email "course-bot@users.noreply.github.com"
          git add courses/dem courses/dem-last-run.log
          git diff --cached --quiet && exit 0
          git commit -m "Elevation data [skip ci]"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
